openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Campus Live API contract
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: identity
  - name: dashboard
  - name: academic
  - name: live
  - name: board
  - name: learning
  - name: registry
  - name: school
paths:
  /academic/subjects:
    get:
      operationId: getAcademicSubjects
      tags: [academic]
      summary: List the organization's subjects
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Subject catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSubjectPage" }
    post:
      operationId: createAcademicSubject
      tags: [academic]
      summary: Create a subject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicSubjectInput" }
      responses:
        "201":
          description: Subject created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSubject" }
  /academic/subjects/{subjectId}:
    put:
      operationId: updateAcademicSubject
      tags: [academic]
      summary: Update or deactivate a subject
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicSubjectUpdate" }
      responses:
        "200":
          description: Subject updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSubject" }
    delete:
      operationId: deleteAcademicSubject
      tags: [academic]
      summary: Delete an unused subject
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Subject deleted }
        "409": { description: Subject is in use }
  /academic/teachers:
    get:
      operationId: getAcademicTeachers
      tags: [academic]
      summary: List teaching staff for assignment
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Organization teaching staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicTeacherPage" }
  /academic/teacher-assignments:
    get:
      operationId: getAcademicTeacherAssignments
      tags: [academic]
      summary: List section and subject teaching assignments
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: sectionId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Teaching assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicTeacherAssignmentPage" }
    post:
      operationId: createAcademicTeacherAssignment
      tags: [academic]
      summary: Assign a teacher to a section subject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicTeacherAssignmentInput" }
      responses:
        "201":
          description: Teaching assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicTeacherAssignment" }
  /academic/teacher-assignments/{assignmentId}:
    delete:
      operationId: deleteAcademicTeacherAssignment
      tags: [academic]
      summary: Remove a teaching assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Assignment deleted }
  /school/attendance:
    get:
      operationId: getSchoolAttendance
      tags: [school]
      summary: Get a section's daily attendance roster
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: sectionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: date, required: true, schema: { type: string } }
      responses:
        "200":
          description: Attendance roster for a section and date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAttendancePage" }
    put:
      operationId: markSchoolAttendance
      tags: [school]
      summary: Save daily attendance for active students
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolAttendanceInput" }
      responses:
        "200":
          description: Saved attendance roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAttendancePage" }
  /announcements:
    get:
      operationId: getAnnouncements
      tags: [school]
      summary: List announcements visible to the signed-in user
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: unread, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Visible announcements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementPage" }
    post:
      operationId: createAnnouncement
      tags: [school]
      summary: Publish an announcement
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Published announcement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "403": { description: User cannot publish to the selected audience }
  /announcements/{announcementId}/read:
    post:
      operationId: markAnnouncementRead
      tags: [school]
      summary: Mark a visible announcement as read
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: announcementId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Read receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementReadReceipt" }
        "404": { description: Announcement not found or not visible }
  /announcements/{announcementId}/stats:
    get:
      operationId: getAnnouncementStats
      tags: [school]
      summary: Get read count for a staff announcement
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: announcementId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Read receipt count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnouncementStats" }
        "403": { description: User cannot view this announcement's statistics }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /identity/auth/login:
    post:
      operationId: login
      tags: [identity]
      summary: Sign in to an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user and access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /identity/auth/change-password:
    post:
      operationId: changePassword
      tags: [identity]
      summary: Change a password, including a forced first-login change
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed; returns a refreshed access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Password does not meet policy
        "401":
          description: Current password is incorrect
        "403":
          description: Temporary password has expired
  /identity/users/{userId}/reset-password:
    post:
      operationId: resetPassword
      tags: [identity]
      summary: Issue a one-time temporary password for a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Temporary password returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPasswordResult"
        "403":
          description: Caller cannot manage the target user's role
  /identity/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Get the current signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get role-scoped dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /academic/classes:
    get:
      operationId: getClasses
      tags: [academic]
      summary: List classes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Classes available to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassSummary"
                  total:
                    type: integer
  /academic/sections:
    get:
      operationId: getSections
      tags: [academic]
      summary: List sections
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: classId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sections available to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SectionSummary"
                  total:
                    type: integer
  /academic/sections/{sectionId}:
    patch:
      operationId: updateSection
      tags: [academic]
      summary: Update section capacity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sectionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionCapacityUpdateInput" }
      responses:
        "200":
          description: Updated section capacity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionSummary" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Section not found }
  /academic/students/available:
    get:
      operationId: getAvailableStudents
      tags: [academic]
      summary: List active students who can be enrolled for an academic year
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: academicYear
          required: true
          schema: { type: string, minLength: 4, maxLength: 24 }
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated students without an enrollment in the requested year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableStudentPage" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
  /academic/students:
    get:
      operationId: getStudents
      tags: [academic]
      summary: Search the student registry or an authorized section roster
      description: Administrators may omit sectionId to search across the school or filter by classId. Other roles must supply sectionId and are limited to students they are authorized to see.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sectionId
          schema:
            type: string
            format: uuid
        - in: query
          name: classId
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated student records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPage"
  /academic/students/{studentId}/profile:
    parameters:
      - in: path
        name: studentId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getStudentProfile
      tags: [academic]
      summary: Get a student's profile for an administrator
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Student profile and current enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfileResponse" }
        "403": { description: Administrator role required }
        "404": { description: Student not found }
    put:
      operationId: updateStudentProfile
      tags: [academic]
      summary: Replace a student's profile fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentProfileUpdateInput" }
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfileResponse" }
        "400": { description: Invalid profile data }
        "403": { description: Administrator role required }
        "404": { description: Student not found }
  /academic/students/{studentId}/enrollments:
    get:
      operationId: getStudentEnrollmentHistory
      tags: [academic]
      summary: List a student's current and previous enrollments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Enrollment history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentEnrollmentHistoryPage" }
        "403": { description: Administrator role required }
        "404": { description: Student not found }
  /academic/enrollments:
    post:
      operationId: createEnrollment
      tags: [academic]
      summary: Enroll an active student into a section if capacity permits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnrollmentInput" }
      responses:
        "201":
          description: Created enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Student or section not found }
        "409": { description: Section is full or an enrollment already exists }
  /academic/enrollments/transfer:
    post:
      operationId: transferStudentEnrollment
      tags: [academic]
      summary: Transfer a student while preserving the previous enrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferEnrollmentInput" }
      responses:
        "200":
          description: Student transferred to the target section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Active enrollment or target section not found }
        "409": { description: Target is full or transfer conflicts with enrollment state }
  /academic/enrollments/graduate:
    post:
      operationId: graduateStudentEnrollment
      tags: [academic]
      summary: Graduate a Grade 12 student and preserve enrollment history
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraduateEnrollmentInput" }
      responses:
        "200":
          description: Student graduated from the final grade
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraduationResult" }
        "400": { description: Invalid enrollment ID }
        "403": { description: Administrator role required }
        "404": { description: Active enrollment not found }
        "409": { description: Student is not in the final grade }
  /academic/enrollments/promote:
    post:
      operationId: promoteStudents
      tags: [academic]
      summary: Promote a class cohort and preserve previous-year enrollments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteStudentsInput" }
      responses:
        "200":
          description: Promoted students
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromotionResult" }
        "400": { description: "Invalid class, year, or section mapping" }
        "403": { description: Administrator role required }
        "404": { description: Source or target class not found }
        "409": { description: "No eligible students, capacity exceeded, or enrollment conflict" }
  /academic/enrollments/transfer/preview:
    post:
      operationId: previewEnrollmentTransfer
      tags: [academic]
      summary: Preview moving one student to another section
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentTransferInput" }
      responses:
        "200":
          description: Transfer review with conflicts and destination capacity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentMovePreview" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Student or destination section not found }
  /academic/enrollments/transfer/commit:
    post:
      operationId: commitEnrollmentTransfer
      tags: [academic]
      summary: Transfer one student and retain the previous enrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentTransferInput" }
      responses:
        "200":
          description: Per-student transfer outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentMoveResult" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Student or destination section not found }
  /academic/enrollments/promote/preview:
    post:
      operationId: previewEnrollmentPromotion
      tags: [academic]
      summary: Preview promoting a class cohort into mapped sections
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentPromotionInput" }
      responses:
        "200":
          description: Cohort review with conflicts and destination capacity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentMovePreview" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Source class or mapped section not found }
  /academic/enrollments/promote/commit:
    post:
      operationId: commitEnrollmentPromotion
      tags: [academic]
      summary: Promote a class cohort and retain previous enrollments
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentPromotionInput" }
      responses:
        "200":
          description: Per-student promotion outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentMoveResult" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Source class or mapped section not found }
  /academic/admissions/preview:
    post:
      operationId: previewStudentAdmissions
      tags: [academic]
      summary: Validate one or more new student admissions without saving
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionBatchInput" }
      responses:
        "200":
          description: Row validation and current section capacity preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionPreview" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Section not found }
  /academic/admissions:
    post:
      operationId: createStudentAdmissions
      tags: [academic]
      summary: Create student accounts and enroll them atomically
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionBatchInput" }
      responses:
        "201":
          description: Created student accounts and one-time temporary credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAdmissions" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Section not found }
        "409": { description: Duplicate student data or section capacity exceeded }
  /academic/enrollments/{enrollmentId}:
    patch:
      operationId: updateEnrollmentYear
      tags: [academic]
      summary: Update enrollment academic year
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: enrollmentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentYearUpdateInput" }
      responses:
        "200":
          description: Updated enrollment year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Enrollment not found }
        "409": { description: Enrollment year conflicts with an existing record }
  /academic/timetable:
    get:
      operationId: getTimetable
      tags: [academic]
      summary: List timetable slots visible to the current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sectionId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized timetable slots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableSlotPage" }
    post:
      operationId: createTimetableSlot
      tags: [academic]
      summary: Create a timetable slot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTimetableSlotInput" }
      responses:
        "201":
          description: Timetable slot created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableSlot" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "409": { description: Teacher or section time conflict }
  /academic/timetable/{slotId}:
    delete:
      operationId: deleteTimetableSlot
      tags: [academic]
      summary: Delete a timetable slot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slotId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Timetable slot deleted }
        "403": { description: Administrator role required }
        "404": { description: Timetable slot not found }
  /academic/consents:
    get:
      operationId: getConsents
      tags: [academic]
      summary: List consent choices for the current guardian's linked students
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Guardian consent status
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentRecord"
                  total:
                    type: integer
    post:
      operationId: grantConsent
      tags: [academic]
      summary: Grant consent for a linked student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentGrantInput"
      responses:
        "201":
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "403":
          description: Caller is not a linked guardian
