      responses:
        "200":
          description: Printable report card HTML
          content:
            text/html:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Role:
      type: string
      enum: [super_admin, org_admin, campus_admin, hod, teacher, class_teacher, student, parent]
    User:
      type: object
      required: [id, orgId, name, email, roles, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        mustChangePassword: { type: boolean }
    LoginInput:
      type: object
      required: [orgSlug, email, password]
      properties:
        orgSlug: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 256 }
    AuthSession:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/User" }
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 256 }
        newPassword: { type: string, minLength: 12, maxLength: 256 }
    TemporaryPasswordResult:
      type: object
      required: [temporaryPassword, expiresAt]
      properties:
        temporaryPassword: { type: string, minLength: 12 }
        expiresAt: { type: string, format: date-time }
    DashboardOverview:
      type: object
      required: [userName, role, metrics, upcomingSessions, recentActivity]
      properties:
        userName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/DashboardMetric" }
        upcomingSessions:
          type: array
          items: { $ref: "#/components/schemas/LiveSession" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
    DashboardMetric:
      type: object
      required: [label, value, change, tone]
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        tone: { type: string, enum: [positive, neutral, warning] }
    ActivityItem:
      type: object
      required: [id, label, description, occurredAt]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    ClassSummary:
      type: object
      required: [id, name, gradeLevel, sectionCount, studentCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gradeLevel: { type: integer }
        sectionCount: { type: integer }
        studentCount: { type: integer }
    SectionSummary:
      type: object
      required: [id, classId, className, name, studentCount, capacity]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        className: { type: string }
        name: { type: string }
        studentCount: { type: integer }
        capacity: { type: [integer, "null"], minimum: 1 }
    StudentSummary:
      type: object
      required: [id, enrollmentId, name, admissionNo, sectionId, sectionName, status, academicYear]
      properties:
        id: { type: string, format: uuid }
        enrollmentId: { type: string, format: uuid }
        name: { type: string }
        admissionNo: { type: string }
        sectionId: { type: string, format: uuid }
        sectionName: { type: string }
        status: { type: string, enum: [active, disabled] }
        academicYear: { type: string, minLength: 4, maxLength: 24 }
    StudentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StudentSummary" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    AvailableStudentSummary:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
    AvailableStudentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AvailableStudentSummary" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    CreateEnrollmentInput:
      type: object
      required: [studentId, sectionId, admissionNo, academicYear]
      properties:
        studentId: { type: string, format: uuid }
        sectionId: { type: string, format: uuid }
        admissionNo: { type: string, minLength: 1, maxLength: 40 }
        academicYear: { type: string, minLength: 4, maxLength: 24 }
    AdmissionBatchInput:
      type: object
      required: [sectionId, academicYear, rows]
      properties:
        sectionId: { type: string, format: uuid }
        academicYear: { type: string, minLength: 4, maxLength: 24 }
        rows:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [name, email, admissionNo]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              email: { type: string, format: email, maxLength: 254 }
              admissionNo: { type: string, minLength: 1, maxLength: 40 }
              dateOfBirth: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
              gender: { type: string, maxLength: 40 }
              phone: { type: string, maxLength: 32 }
              address: { type: string, maxLength: 500 }
              bloodGroup: { type: string, maxLength: 8 }
              guardianName: { type: string, maxLength: 120 }
              guardianEmail: { type: string, format: email, maxLength: 254 }
              guardianPhone: { type: string, maxLength: 32 }
              guardianRelationship: { type: string, maxLength: 40 }
    AdmissionPreviewRow:
      type: object
      required: [row, name, email, admissionNo]
      properties:
        row: { type: integer, minimum: 1 }
        name: { type: string }
        email: { type: string, format: email }
        admissionNo: { type: string }
        dateOfBirth: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        gender: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        address: { type: [string, "null"] }
        bloodGroup: { type: [string, "null"] }
        guardianName: { type: [string, "null"] }
        guardianEmail: { type: [string, "null"], format: email }
        guardianPhone: { type: [string, "null"] }
        guardianRelationship: { type: [string, "null"] }
    AdmissionRowError:
      type: object
      required: [row, field, message]
      properties:
        row: { type: integer, minimum: 1 }
        field: { type: string }
        message: { type: string }
    AdmissionPreview:
      type: object
      required: [sectionId, sectionName, academicYear, capacity, activeEnrollmentCount, seatsAvailable, valid, items, errors]
      properties:
        sectionId: { type: string, format: uuid }
        sectionName: { type: string }
        academicYear: { type: string }
        capacity: { type: [integer, "null"] }
        activeEnrollmentCount: { type: integer }
        seatsAvailable: { type: [integer, "null"] }
        valid: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdmissionPreviewRow" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/AdmissionRowError" }
    CreatedAdmission:
      type: object
      required: [id, name, email, admissionNo, sectionId, sectionName, academicYear, temporaryPassword, temporaryPasswordExpiresAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        admissionNo: { type: string }
        sectionId: { type: string, format: uuid }
        sectionName: { type: string }
        academicYear: { type: string }
        temporaryPassword: { type: string }
        temporaryPasswordExpiresAt: { type: string, format: date-time }
    CreatedAdmissions:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CreatedAdmission" }
        total: { type: integer }
    SectionCapacityUpdateInput:
      type: object
      required: [capacity]
      properties:
        capacity: { type: [integer, "null"], minimum: 1 }
    EnrollmentYearUpdateInput:
      type: object
      required: [academicYear]
      properties:
        academicYear: { type: string, minLength: 4, maxLength: 24 }
    CreateTimetableSlotInput:
      type: object
      required: [sectionId, subjectId, teacherId, weekday, startTime, endTime]
      properties:
        sectionId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        teacherId: { type: string, format: uuid }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        endTime: { type: string, pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        room: { type: [string, "null"], maxLength: 80 }
    TimetableSlot:
      type: object
      required: [id, sectionId, sectionName, subjectId, subjectName, teacherId, teacherName, weekday, startTime, endTime, room]
      properties:
        id: { type: string, format: uuid }
        sectionId: { type: string, format: uuid }
        sectionName: { type: string }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: string }
        endTime: { type: string }
        room: { type: [string, "null"] }
    TimetableSlotPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TimetableSlot" }
        total: { type: integer }
    ConsentPurpose:
      type: string
      enum: [live_view, recording, photo, data_processing]
    ConsentGrantInput:
      type: object
      required: [studentId, purpose]
      properties:
        studentId: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
    ConsentRecord:
      type: object
      required: [studentId, studentName, purpose, granted, grantedAt, revokedAt]
      properties:
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        granted: { type: boolean }
        grantedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
    ConsentReviewStatus:
      type: object
      required: [required, reviewedAt]
      properties:
        required: { type: boolean }
        reviewedAt: { type: ["string", "null"], format: date-time }
    GuardianLink:
      type: object
      required: [studentId, studentName, guardianId, guardianName, guardianEmail, relationship, canViewLive, canPayFees]
      properties:
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        guardianId: { type: string, format: uuid }
        guardianName: { type: string }
        guardianEmail: { type: string, format: email }
        relationship: { type: string }
        canViewLive: { type: boolean }
        canPayFees: { type: boolean }
    GuardianLinkPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GuardianLink" }
        total: { type: integer }
    GuardianLinkFlagsInput:
      type: object
      required: [canViewLive, canPayFees]
      properties:
        canViewLive: { type: boolean }
        canPayFees: { type: boolean }
    LiveSession:
      type: object
      required: [id, title, teacherName, mode, status, startAt, parentView, sections]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        teacherName: { type: string }
        mode: { type: string, enum: [section, class] }
        status: { type: string, enum: [scheduled, live, ended, cancelled] }
        startAt: { type: string, format: date-time }
        parentView: { type: boolean }
        sections:
          type: array
          items: { type: string }
    LiveSessionInput:
      type: object
      required: [title, mode, startAt, sectionIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        mode: { type: string, enum: [section, class] }
        startAt: { type: string, format: date-time }
        classId: { type: ["string", "null"], format: uuid }
        sectionIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        parentView: { type: boolean, default: false }
    LiveKitJoin:
      type: object
      required: [url, token, roomName]
      properties:
        url: { type: string, format: uri }
        token: { type: string }
        roomName: { type: string }
    BoardTemplate:
      type: object
      required: [id, name, scope, config, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [system, org, class, section, teacher] }
        config: { $ref: "#/components/schemas/BoardConfig" }
        isDefault: { type: boolean }
    BoardTemplateInput:
      type: object
      required: [name, scope, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scope: { type: string, enum: [org, class, section, teacher] }
        config: { $ref: "#/components/schemas/BoardConfig" }
    BoardTemplateUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        config: { $ref: "#/components/schemas/BoardConfig" }
        isDefault: { type: boolean }
    BoardConfig:
      type: object
      required: [background, canvas, tools, defaultTool, palette, penSizes, toolbar, participants, features]
      properties:
        background:
          type: object
          required: [type, color, lineColor, spacing]
          properties:
            type: { type: string, enum: [blank, ruled, grid, dots, graph, music, image] }
            color: { type: string, maxLength: 32 }
            lineColor: { type: string, maxLength: 32 }
            spacing: { type: number, minimum: 4, maximum: 100 }
        canvas:
          type: object
          required: [mode, aspect, maxPages]
          properties:
            mode: { type: string, enum: [infinite, fixed] }
            aspect: { type: string, enum: ["16:9", "4:3", A4, free] }
            maxPages: { type: integer, minimum: 1, maximum: 100 }
        tools:
          type: array
          items:
            type: string
