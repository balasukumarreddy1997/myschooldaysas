        - in: path
          name: examId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Scoped marks grid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningMarkPage" }
    put:
      operationId: updateLearningExamMarks
      tags: [learning]
      summary: Save marks for an unpublished assessment
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: examId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningMarksInput" }
      responses:
        "200":
          description: Updated marks grid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningMarkPage" }
        "409": { description: Published marks are locked }
  /learning/exams/{examId}/publish:
    post:
      operationId: publishLearningExam
      tags: [learning]
      summary: Publish or unpublish exam results
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: examId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningExamPublishInput" }
      responses:
        "200":
          description: Updated assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningExam" }
        "409": { description: Every active student must have a score before publishing }
  /learning/terms:
    get:
      operationId: getLearningTerms
      tags: [learning]
      summary: List assessment terms
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Terms for the organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningTermPage" }
    post:
      operationId: createLearningTerm
      tags: [learning]
      summary: Create an assessment term
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningTermInput" }
      responses:
        "201":
          description: Created term
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningTerm" }
  /learning/grade-scale:
    get:
      operationId: getLearningGradeScale
      tags: [learning]
      summary: Get the organization grade scale
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Grade scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningGradeScale" }
    put:
      operationId: updateLearningGradeScale
      tags: [learning]
      summary: Update the organization grade scale
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningGradeScaleInput" }
      responses:
        "200":
          description: Updated grade scale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningGradeScale" }
  /learning/report-cards:
    get:
      operationId: getLearningReportCards
      tags: [learning]
      summary: List reports for a section or linked family
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: sectionId, schema: { type: string, format: uuid } }
        - { in: query, name: termId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Role-scoped report cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReportCardPage" }
    post:
      operationId: prepareLearningReportCards
      tags: [learning]
      summary: Prepare draft report cards for a section and term
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningReportCardPrepareInput" }
      responses:
        "201":
          description: Draft cards prepared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReportCardPage" }
  /learning/report-cards/publish:
    post:
      operationId: publishLearningReportCards
      tags: [learning]
      summary: Publish or withdraw report cards for a section and term
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningReportCardPublishInput" }
      responses:
        "200":
          description: Updated publication status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReportCardPage" }
  /learning/report-cards/{reportCardId}:
    get:
      operationId: getLearningReportCard
      tags: [learning]
      summary: Get a report card for an authorized student
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reportCardId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Report card details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReportCard" }
  /learning/report-cards/{reportCardId}/remark:
    post:
      operationId: addLearningReportCardRemark
      tags: [learning]
      summary: Add or update a draft report card remark
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reportCardId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningReportCardRemarkInput" }
      responses:
        "200":
          description: Updated report card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningReportCard" }
