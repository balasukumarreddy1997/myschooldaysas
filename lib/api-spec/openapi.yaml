openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Campus Live API contract
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: identity
  - name: dashboard
  - name: academic
  - name: live
  - name: board
  - name: learning
paths:
  /academic/subjects:
    get:
      operationId: getAcademicSubjects
      tags: [academic]
      summary: List the organization's subjects
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Subject catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSubjectPage" }
    post:
      operationId: createAcademicSubject
      tags: [academic]
      summary: Create a subject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicSubjectInput" }
      responses:
        "201":
          description: Subject created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSubject" }
  /academic/subjects/{subjectId}:
    put:
      operationId: updateAcademicSubject
      tags: [academic]
      summary: Update or deactivate a subject
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicSubjectUpdate" }
      responses:
        "200":
          description: Subject updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicSubject" }
    delete:
      operationId: deleteAcademicSubject
      tags: [academic]
      summary: Delete an unused subject
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: subjectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Subject deleted }
        "409": { description: Subject is in use }
  /academic/teachers:
    get:
      operationId: getAcademicTeachers
      tags: [academic]
      summary: List teaching staff for assignment
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Organization teaching staff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicTeacherPage" }
  /academic/teacher-assignments:
    get:
      operationId: getAcademicTeacherAssignments
      tags: [academic]
      summary: List section and subject teaching assignments
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: sectionId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Teaching assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicTeacherAssignmentPage" }
    post:
      operationId: createAcademicTeacherAssignment
      tags: [academic]
      summary: Assign a teacher to a section subject
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicTeacherAssignmentInput" }
      responses:
        "201":
          description: Teaching assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicTeacherAssignment" }
  /academic/teacher-assignments/{assignmentId}:
    delete:
      operationId: deleteAcademicTeacherAssignment
      tags: [academic]
      summary: Remove a teaching assignment
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Assignment deleted }
  /school/attendance:
    get:
      operationId: getSchoolAttendance
      tags: [school]
      summary: Get a section's daily attendance roster
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: sectionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: date, required: true, schema: { type: string } }
      responses:
        "200":
          description: Attendance roster for a section and date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAttendancePage" }
    put:
      operationId: markSchoolAttendance
      tags: [school]
      summary: Save daily attendance for active students
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolAttendanceInput" }
      responses:
        "200":
          description: Saved attendance roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolAttendancePage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /identity/auth/login:
    post:
      operationId: login
      tags: [identity]
      summary: Sign in to an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user and access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /identity/auth/change-password:
    post:
      operationId: changePassword
      tags: [identity]
      summary: Change a password, including a forced first-login change
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed; returns a refreshed access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Password does not meet policy
        "401":
          description: Current password is incorrect
        "403":
          description: Temporary password has expired
  /identity/users/{userId}/reset-password:
    post:
      operationId: resetPassword
      tags: [identity]
      summary: Issue a one-time temporary password for a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Temporary password returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPasswordResult"
        "403":
          description: Caller cannot manage the target user's role
  /identity/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Get the current signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get role-scoped dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /academic/classes:
    get:
      operationId: getClasses
      tags: [academic]
      summary: List classes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Classes available to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassSummary"
                  total:
                    type: integer
  /academic/sections:
    get:
      operationId: getSections
      tags: [academic]
      summary: List sections
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: classId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sections available to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SectionSummary"
                  total:
                    type: integer
  /academic/sections/{sectionId}:
    patch:
      operationId: updateSection
      tags: [academic]
      summary: Update section capacity
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sectionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionCapacityUpdateInput" }
      responses:
        "200":
          description: Updated section capacity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionSummary" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Section not found }
  /academic/students/available:
    get:
      operationId: getAvailableStudents
      tags: [academic]
      summary: List active students who can be enrolled for an academic year
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: academicYear
          required: true
          schema: { type: string, minLength: 4, maxLength: 24 }
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated students without an enrollment in the requested year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailableStudentPage" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
  /academic/students:
    get:
      operationId: getStudents
      tags: [academic]
      summary: List students in an authorized section
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sectionId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated student records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPage"
  /academic/enrollments:
    post:
      operationId: createEnrollment
      tags: [academic]
      summary: Enroll an active student into a section if capacity permits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnrollmentInput" }
      responses:
        "201":
          description: Created enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Student or section not found }
        "409": { description: Section is full or an enrollment already exists }
  /academic/admissions/preview:
    post:
      operationId: previewStudentAdmissions
      tags: [academic]
      summary: Validate one or more new student admissions without saving
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionBatchInput" }
      responses:
        "200":
          description: Row validation and current section capacity preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionPreview" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Section not found }
  /academic/admissions:
    post:
      operationId: createStudentAdmissions
      tags: [academic]
      summary: Create student accounts and enroll them atomically
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionBatchInput" }
      responses:
        "201":
          description: Created student accounts and one-time temporary credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAdmissions" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Section not found }
        "409": { description: Duplicate student data or section capacity exceeded }
  /academic/enrollments/{enrollmentId}:
    patch:
      operationId: updateEnrollmentYear
      tags: [academic]
      summary: Update enrollment academic year
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: enrollmentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentYearUpdateInput" }
      responses:
        "200":
          description: Updated enrollment year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSummary" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "404": { description: Enrollment not found }
        "409": { description: Enrollment year conflicts with an existing record }
  /academic/timetable:
    get:
      operationId: getTimetable
      tags: [academic]
      summary: List timetable slots visible to the current user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sectionId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authorized timetable slots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableSlotPage" }
    post:
      operationId: createTimetableSlot
      tags: [academic]
      summary: Create a timetable slot
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTimetableSlotInput" }
      responses:
        "201":
          description: Timetable slot created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableSlot" }
        "400": { description: Invalid request }
        "403": { description: Administrator role required }
        "409": { description: Teacher or section time conflict }
  /academic/timetable/{slotId}:
    delete:
      operationId: deleteTimetableSlot
      tags: [academic]
      summary: Delete a timetable slot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: slotId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Timetable slot deleted }
        "403": { description: Administrator role required }
        "404": { description: Timetable slot not found }
  /academic/consents:
    get:
      operationId: getConsents
      tags: [academic]
      summary: List consent choices for the current guardian's linked students
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Guardian consent status
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentRecord"
                  total:
                    type: integer
    post:
      operationId: grantConsent
      tags: [academic]
      summary: Grant consent for a linked student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentGrantInput"
      responses:
        "201":
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "403":
          description: Caller is not a linked guardian
  /academic/consents/{studentId}/{purpose}:
    delete:
      operationId: revokeConsent
      tags: [academic]
      summary: Revoke consent previously granted by the current guardian
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: purpose
          required: true
          schema:
            $ref: "#/components/schemas/ConsentPurpose"
      responses:
        "200":
          description: Revocation status
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        "403":
          description: Caller is not the guardian who granted the consent
  /academic/consents/review-status:
    get:
      operationId: getConsentReviewStatus
      tags: [academic]
      summary: Get whether the current guardian has reviewed consent choices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consent review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentReviewStatus"
        "403":
          description: Caller is not a guardian
  /academic/consents/review:
    post:
      operationId: completeConsentReview
      tags: [academic]
      summary: Record that the current guardian reviewed consent choices
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated consent review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentReviewStatus"
        "403":
          description: Caller is not a guardian
  /academic/guardians:
    get:
      operationId: getGuardianLinks
      tags: [academic]
      summary: List guardian links and privacy flags for administrators
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated guardian links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianLinkPage"
        "403":
          description: Administrator role required
  /academic/guardians/{studentId}/{guardianId}:
    patch:
      operationId: updateGuardianLinkFlags
      tags: [academic]
      summary: Update privacy and payment flags for a guardian link
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: guardianId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianLinkFlagsInput"
      responses:
        "200":
          description: Updated guardian link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianLink"
        "403":
          description: Administrator role required
        "404":
          description: Guardian link not found
  /live/sessions:
    get:
      operationId: getSessions
      tags: [live]
      summary: List live classes available to the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions available to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveSession"
                  total:
                    type: integer
    post:
      operationId: createSession
      tags: [live]
      summary: Schedule a live class
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveSessionInput"
      responses:
        "201":
          description: Scheduled live class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /live/sessions/{sessionId}/start:
    post:
      operationId: startSession
      tags: [live]
      summary: Start a scheduled live class
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Started session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /live/sessions/{sessionId}/end:
    post:
      operationId: endSession
      tags: [live]
      summary: End a live class and finalize attendance
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ended session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /live/sessions/{sessionId}/token:
    post:
      operationId: getSessionToken
      tags: [live]
      summary: Get a server-minted LiveKit token with role-scoped grants
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: LiveKit connection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitJoin"
  /board/templates:
    get:
      operationId: getBoardTemplates
      tags: [board]
      summary: List accessible smartboard templates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accessible templates
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoardTemplate"
                  total:
                    type: integer
    post:
      operationId: createBoardTemplate
      tags: [board]
      summary: Create a smartboard template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardTemplate"
  /board/templates/{templateId}:
    patch:
      operationId: updateBoardTemplate
      tags: [board]
      summary: Update a smartboard template
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardTemplate"
  /learning/assignments:
    get:
      operationId: getLearningAssignments
      tags: [learning]
      summary: List assignments available to the caller
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: sectionId, schema: { type: string, format: uuid } }
        - { in: query, name: status, schema: { type: string, enum: [draft, published, closed] } }
      responses:
        "200":
          description: Scoped assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningAssignmentPage" }
    post:
      operationId: createLearningAssignment
      tags: [learning]
      summary: Create a draft assignment for an assigned section
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningAssignmentInput" }
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningAssignment" }
  /learning/assignments/{assignmentId}:
    put:
      operationId: updateLearningAssignment
      tags: [learning]
      summary: Edit a draft or change assignment publication status
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningAssignmentUpdate" }
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningAssignment" }
        "409": { description: Assignment transition is not allowed }
