openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Campus Live API contract
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: identity
  - name: dashboard
  - name: academic
  - name: live
  - name: board
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /identity/auth/login:
    post:
      operationId: login
      tags: [identity]
      summary: Sign in to an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user and access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /identity/auth/change-password:
    post:
      operationId: changePassword
      tags: [identity]
      summary: Change a password, including a forced first-login change
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed; returns a refreshed access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Password does not meet policy
        "401":
          description: Current password is incorrect
        "403":
          description: Temporary password has expired
  /identity/users/{userId}/reset-password:
    post:
      operationId: resetPassword
      tags: [identity]
      summary: Issue a one-time temporary password for a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Temporary password returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPasswordResult"
        "403":
          description: Caller cannot manage the target user's role
  /identity/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Get the current signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get role-scoped dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /academic/classes:
    get:
      operationId: getClasses
      tags: [academic]
      summary: List classes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Classes available to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClassSummary"
                  total:
                    type: integer
  /academic/sections:
    get:
      operationId: getSections
      tags: [academic]
      summary: List sections
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: classId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sections available to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SectionSummary"
                  total:
                    type: integer
  /academic/students:
    get:
      operationId: getStudents
      tags: [academic]
      summary: List students in an authorized section
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sectionId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          schema:
            type: string
            maxLength: 100
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated student records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPage"
  /academic/consents:
    get:
      operationId: getConsents
      tags: [academic]
      summary: List consent choices for the current guardian's linked students
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Guardian consent status
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConsentRecord"
                  total:
                    type: integer
    post:
      operationId: grantConsent
      tags: [academic]
      summary: Grant consent for a linked student
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentGrantInput"
      responses:
        "201":
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
        "403":
          description: Caller is not a linked guardian
  /academic/consents/{studentId}/{purpose}:
    delete:
      operationId: revokeConsent
      tags: [academic]
      summary: Revoke consent previously granted by the current guardian
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: purpose
          required: true
          schema:
            $ref: "#/components/schemas/ConsentPurpose"
      responses:
        "200":
          description: Revocation status
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        "403":
          description: Caller is not the guardian who granted the consent
  /live/sessions:
    get:
      operationId: getSessions
      tags: [live]
      summary: List live classes available to the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessions available to the current user
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LiveSession"
                  total:
                    type: integer
    post:
      operationId: createSession
      tags: [live]
      summary: Schedule a live class
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveSessionInput"
      responses:
        "201":
          description: Scheduled live class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /live/sessions/{sessionId}/start:
    post:
      operationId: startSession
      tags: [live]
      summary: Start a scheduled live class
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Started session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /live/sessions/{sessionId}/end:
    post:
      operationId: endSession
      tags: [live]
      summary: End a live class and finalize attendance
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ended session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /live/sessions/{sessionId}/token:
    post:
      operationId: getSessionToken
      tags: [live]
      summary: Get a server-minted LiveKit token with role-scoped grants
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: LiveKit connection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitJoin"
  /board/templates:
    get:
      operationId: getBoardTemplates
      tags: [board]
      summary: List accessible smartboard templates
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accessible templates
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BoardTemplate"
                  total:
                    type: integer
    post:
      operationId: createBoardTemplate
      tags: [board]
      summary: Create a smartboard template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardTemplateInput"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardTemplate"
  /board/templates/{templateId}:
    patch:
      operationId: updateBoardTemplate
      tags: [board]
      summary: Update a smartboard template
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoardTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardTemplate"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Role:
      type: string
      enum: [super_admin, org_admin, campus_admin, hod, teacher, class_teacher, student, parent]
    User:
      type: object
      required: [id, orgId, name, email, roles, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        mustChangePassword: { type: boolean }
    LoginInput:
      type: object
      required: [orgSlug, email, password]
      properties:
        orgSlug: { type: string, minLength: 1, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 256 }
    AuthSession:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/User" }
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 256 }
        newPassword: { type: string, minLength: 12, maxLength: 256 }
    TemporaryPasswordResult:
      type: object
      required: [temporaryPassword, expiresAt]
      properties:
        temporaryPassword: { type: string, minLength: 12 }
        expiresAt: { type: string, format: date-time }
    DashboardOverview:
      type: object
      required: [userName, role, metrics, upcomingSessions, recentActivity]
      properties:
        userName: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/DashboardMetric" }
        upcomingSessions:
          type: array
          items: { $ref: "#/components/schemas/LiveSession" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
    DashboardMetric:
      type: object
      required: [label, value, change, tone]
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        tone: { type: string, enum: [positive, neutral, warning] }
    ActivityItem:
      type: object
      required: [id, label, description, occurredAt]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time }
    ClassSummary:
      type: object
      required: [id, name, gradeLevel, sectionCount, studentCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        gradeLevel: { type: integer }
        sectionCount: { type: integer }
        studentCount: { type: integer }
    SectionSummary:
      type: object
      required: [id, classId, className, name, studentCount]
      properties:
        id: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        className: { type: string }
        name: { type: string }
        studentCount: { type: integer }
    StudentSummary:
      type: object
      required: [id, name, admissionNo, sectionId, sectionName, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        admissionNo: { type: string }
        sectionId: { type: string, format: uuid }
        sectionName: { type: string }
        status: { type: string, enum: [active, disabled] }
    StudentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StudentSummary" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    ConsentPurpose:
      type: string
      enum: [live_view, recording, photo, data_processing]
    ConsentGrantInput:
      type: object
      required: [studentId, purpose]
      properties:
        studentId: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
    ConsentRecord:
      type: object
      required: [studentId, studentName, purpose, granted, grantedAt, revokedAt]
      properties:
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        purpose: { $ref: "#/components/schemas/ConsentPurpose" }
        granted: { type: boolean }
        grantedAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
    LiveSession:
      type: object
      required: [id, title, teacherName, mode, status, startAt, parentView, sections]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        teacherName: { type: string }
        mode: { type: string, enum: [section, class] }
        status: { type: string, enum: [scheduled, live, ended, cancelled] }
        startAt: { type: string, format: date-time }
        parentView: { type: boolean }
        sections:
          type: array
          items: { type: string }
    LiveSessionInput:
      type: object
      required: [title, mode, startAt, sectionIds]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        mode: { type: string, enum: [section, class] }
        startAt: { type: string, format: date-time }
        classId: { type: ["string", "null"], format: uuid }
        sectionIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        parentView: { type: boolean, default: false }
    LiveKitJoin:
      type: object
      required: [url, token, roomName]
      properties:
        url: { type: string, format: uri }
        token: { type: string }
        roomName: { type: string }
    BoardTemplate:
      type: object
      required: [id, name, scope, config, isDefault]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope: { type: string, enum: [system, org, class, section, teacher] }
        config: { $ref: "#/components/schemas/BoardConfig" }
        isDefault: { type: boolean }
    BoardTemplateInput:
      type: object
      required: [name, scope, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scope: { type: string, enum: [org, class, section, teacher] }
        config: { $ref: "#/components/schemas/BoardConfig" }
    BoardTemplateUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        config: { $ref: "#/components/schemas/BoardConfig" }
        isDefault: { type: boolean }
    BoardConfig:
      type: object
      required: [background, canvas, tools, defaultTool, palette, penSizes, toolbar, participants, features]
      properties:
        background:
          type: object
          required: [type, color, lineColor, spacing]
          properties:
            type: { type: string, enum: [blank, ruled, grid, dots, graph, music, image] }
            color: { type: string, maxLength: 32 }
            lineColor: { type: string, maxLength: 32 }
            spacing: { type: number, minimum: 4, maximum: 100 }
        canvas:
          type: object
          required: [mode, aspect, maxPages]
          properties:
            mode: { type: string, enum: [infinite, fixed] }
            aspect: { type: string, enum: ["16:9", "4:3", A4, free] }
            maxPages: { type: integer, minimum: 1, maximum: 100 }
        tools:
          type: array
          items:
            type: string
            enum: [select, pen, highlighter, eraser, laser, line, arrow, rect, ellipse, triangle, text, sticky, image, ruler, protractor, compass, graph, latex, pan]
        defaultTool: { type: string }
        palette:
          type: array
          items: { type: string, maxLength: 32 }
        penSizes:
          type: array
          items: { type: number, minimum: 1, maximum: 64 }
        toolbar:
          type: object
          required: [position, size, autoHide]
          properties:
            position: { type: string, enum: [left, right, top, bottom] }
            size: { type: string, enum: [compact, regular, large] }
            autoHide: { type: boolean }
        participants:
          type: object
          required: [studentsCanView, studentsCanDraw, allowDrawGrants, studentTools, followTeacherPage]
          properties:
            studentsCanView: { type: boolean }
            studentsCanDraw: { type: boolean }
            allowDrawGrants: { type: boolean }
            studentTools:
              type: array
              items: { type: string }
            followTeacherPage: { type: boolean }
        features:
          type: object
          required: [pressureSensitivity, palmRejection, shapeRecognition, undoRedo, snapshotIntervalSec, exportFormats]
          properties:
            pressureSensitivity: { type: boolean }
            palmRejection: { type: boolean }
            shapeRecognition: { type: boolean }
            undoRedo: { type: boolean }
            snapshotIntervalSec: { type: integer, minimum: 5, maximum: 600 }
            exportFormats:
              type: array
              items: { type: string, enum: [png, pdf, json] }

