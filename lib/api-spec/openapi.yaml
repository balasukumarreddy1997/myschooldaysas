components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Role:
      type: string
      enum: [super_admin, org_admin, campus_admin, hod, teacher, class_teacher, student, parent]
    User:
      type: object
      required: [id, orgId, name, email, roles, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        mustChangePassword: { type: boolean }
    LoginInput:
      type: object
      required: [orgSlug, email, password]
