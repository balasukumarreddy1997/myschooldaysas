          application/json:
            schema: { $ref: "#/components/schemas/LearningExamInput" }
      responses:
        "201":
          description: Assessment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningExam" }
  /learning/exams/{examId}/marks:
    get:
      operationId: getLearningExamMarks
